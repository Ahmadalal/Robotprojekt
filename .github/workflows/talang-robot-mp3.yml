name: Build Talang solo robot MP3 files

on:
  push:
    branches:
      - tmp-talang-mp3-20260823
    paths:
      - "talang_tts/**"
      - ".github/workflows/talang-robot-mp3.yml"
  pull_request:
    branches:
      - main
    paths:
      - "talang_tts/**"
      - ".github/workflows/talang-robot-mp3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate final MP3 files
        run: python talang_tts/generate_mp3.py

      - name: Verify package
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          path = Path("talang_tts/Talang_Robot_MP3.zip")
          assert path.exists() and path.stat().st_size > 1000
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              assert len(names) == 52, len(names)
              assert all(name.lower().endswith(".mp3") for name in names), names
              assert all("/" not in name for name in names), names
          print("Verified 52 MP3-only solo files")
          PY

      - name: Upload MP3-only ZIP
        uses: actions/upload-artifact@v4
        with:
          name: talang-solo-robot-mp3
          path: talang_tts/Talang_Robot_MP3.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
